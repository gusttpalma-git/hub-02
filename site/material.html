<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Material de balcão — Patinha de Natal</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --pine: #1e5a3c; --pine-deep: #123726; --berry: #b8322a; --gold: #d9a441; --cream: #fbf6ee; --ink: #1f2a24; --muted: #5b665f; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9e4da; color: var(--ink); font-family: "Nunito", system-ui, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .bar { position: sticky; top: 0; z-index: 2; background: var(--pine-deep); color: #fff; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .bar b { margin-right: auto; font-size: 1rem; }
    .bar button { border: 2px solid #fff3; background: transparent; color: #fff; border-radius: 999px; padding: 8px 14px; font: 800 .9rem "Nunito", sans-serif; cursor: pointer; }
    .bar button.on { background: #fff; color: var(--pine-deep); }
    .bar .print { background: var(--gold); color: #3d2a00; border-color: var(--gold); }
    .tip { max-width: 760px; margin: 14px auto 0; padding: 0 16px; color: var(--muted); font-weight: 700; font-size: .92rem; }
    .sheet { margin: 16px auto 40px; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.15); overflow: hidden; }
    .a5 .sheet { width: 148mm; height: 210mm; }
    .a4 .sheet { width: 210mm; height: 297mm; display: grid; }
    .a6x4 .sheet { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .cards .sheet { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(5, 1fr); padding: 13.5mm 15mm; gap: 0; }
    @media screen and (max-width: 820px) { .sheet { zoom: .5; } }
    @media screen and (max-width: 420px) { .sheet { zoom: .42; } }

    /* painel (display / A6) */
    .panel { position: relative; width: 100%; height: 100%; padding: 9mm 9mm 7mm; display: flex; flex-direction: column; align-items: center; text-align: center; background:
      radial-gradient(circle at 12% 6%, #fff 0 3px, transparent 4px) 0 0 / 22mm 22mm, linear-gradient(180deg, #fbf6ee, #fff 55%); border: .3mm dashed #d9cdb8; }
    .a5 .panel { border: 0; }
    .panel .brand { font: 800 3.4mm "Nunito"; color: var(--pine); letter-spacing: .12em; text-transform: uppercase; }
    .panel h1 { margin: 2mm 0 1.5mm; font: 700 11mm/1.02 "Fraunces", Georgia, serif; color: var(--pine-deep); }
    .panel h1 em { color: var(--berry); font-style: italic; }
    .panel .sub { margin: 0 0 4mm; font: 800 4.4mm/1.25 "Nunito"; color: var(--ink); }
    .panel .sub b { color: var(--berry); }
    .ex { display: flex; align-items: center; justify-content: center; gap: 3mm; margin-bottom: 4mm; }
    .ex img { width: 31mm; height: 31mm; object-fit: cover; border-radius: 50%; border: 1.2mm solid #fff; box-shadow: 0 1mm 3mm rgba(0,0,0,.18); }
    .ex img.orn { width: 37mm; height: 37mm; }
    .ex span { font: 900 8mm "Nunito"; color: var(--gold); }
    .qrbox { background: #fff; border: 1.4mm solid var(--pine); border-radius: 5mm; padding: 2.5mm; position: relative; }
    .qrbox svg { display: block; width: 56mm; height: 56mm; }
    .qrbox::before { content: "📱 Aponte a câmera"; position: absolute; top: -4.2mm; left: 50%; transform: translateX(-50%); background: var(--berry); color: #fff; font: 900 3.6mm "Nunito"; padding: 1mm 4mm; border-radius: 99mm; white-space: nowrap; }
    .url { margin: 2.5mm 0 0; font: 800 3.4mm "Nunito"; color: var(--muted); word-break: break-all; }
    .steps { display: flex; gap: 2mm; margin: 3.5mm 0 0; font: 800 3.3mm/1.2 "Nunito"; }
    .steps div { flex: 1; background: #fff; border: .3mm solid #e8decd; border-radius: 3mm; padding: 1.8mm 1.4mm; }
    .steps b { display: block; color: var(--berry); font-size: 4.4mm; }
    .foot { margin-top: auto; font: 800 3.2mm "Nunito"; color: var(--muted); }
    .foot b { color: var(--pine-deep); }

    /* A6: tudo um pouco menor */
    .a6x4 .panel { padding: 5mm 5mm 4mm; }
    .a6x4 .panel h1 { font-size: 7.2mm; margin: 1.2mm 0 1mm; }
    .a6x4 .panel .sub { font-size: 3.2mm; margin-bottom: 2.4mm; }
    .a6x4 .ex img { width: 19mm; height: 19mm; border-width: .8mm; }
    .a6x4 .ex img.orn { width: 23mm; height: 23mm; }
    .a6x4 .ex span { font-size: 5mm; }
    .a6x4 .ex { margin-bottom: 3.2mm; }
    .a6x4 .qrbox svg { width: 38mm; height: 38mm; }
    .a6x4 .qrbox::before { font-size: 2.8mm; top: -3.4mm; }
    .a6x4 .steps, .a6x4 .url { display: none; }
    .a6x4 .panel .brand { font-size: 2.6mm; }
    .a6x4 .foot { font-size: 2.6mm; }

    /* cartãozinho (cartão de visita 9 x 5 cm, 10 por folha) */
    .cardv { display: grid; grid-template-columns: 1fr 26mm; gap: 2.5mm; align-items: center; padding: 3.5mm 4mm; border: .25mm dashed #cfc3ad; background: linear-gradient(135deg, #fbf6ee, #fff); }
    .cardv h2 { margin: 0 0 1mm; font: 700 4.6mm/1.05 "Fraunces", Georgia, serif; color: var(--pine-deep); }
    .cardv h2 em { color: var(--berry); }
    .cardv p { margin: 0; font: 800 2.7mm/1.3 "Nunito"; }
    .cardv p b { color: var(--berry); }
    .cardv small { display: block; margin-top: 1.2mm; font: 800 2.3mm "Nunito"; color: var(--muted); }
    .cardv svg { width: 26mm; height: 26mm; display: block; }

    @media print {
      body { background: #fff; }
      .bar, .tip { display: none; }
      .sheet { margin: 0; box-shadow: none; zoom: 1 !important; }
    }
  </style>
  <style id="page-size">@page { size: A5; margin: 0; }</style>
</head>
<body class="a5">
  <div class="bar">
    <b id="title">Material de balcão</b>
    <button type="button" data-fmt="a5" class="on">Display A5</button>
    <button type="button" data-fmt="a6x4">4 displays A6 (folha A4)</button>
    <button type="button" data-fmt="cards">10 cartõezinhos (A4)</button>
    <button type="button" class="print" onclick="print()">🖨️ Imprimir / salvar PDF</button>
  </div>
  <p class="tip" id="tip">Dica: imprima em papel fotográfico ou couchê 180 g, em cores, "tamanho real" (sem ajustar à página). O display A5 cabe num porta-folheto de acrílico A5 — ou imprima um suporte na sua impressora 3D.</p>
  <div id="out"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js?v=16"></script>
  <script src="js/vendor/qrcode.js?v=16"></script>
  <script>
  (function () {
    const q = new URLSearchParams(location.search);
    const code = (q.get("c") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
    const store = (q.get("n") || "").slice(0, 80);
    const base = location.href.split(/[?#]/)[0].replace(/[^/]*$/, "");
    const link = base + (code ? "?p=" + code : "");
    const shortLink = link.replace(/^https?:\/\//, "").replace(/\/\?/, "/?");
    let price = "R$ 39,90";
    const freeShip = { v: true };
    let pickupHere = false;
    document.getElementById("title").textContent = "Material de balcão" + (store ? " — " + store : "");

    // QR em SVG (nítido em qualquer tamanho de impressão)
    function qrSvg(text) {
      const qr = qrcode(0, "M");
      qr.addData(text);
      qr.make();
      const n = qr.getModuleCount(), m = 2, size = n + m * 2;
      let d = "";
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" role="img" aria-label="QR Code"><rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#123726"/></svg>`;
    }
    const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

    function panel(svg) {
      return `<div class="panel">
        <div class="brand">🐾 Patinha de Natal</div>
        <h1>Seu pet virou <em>enfeite de Natal</em></h1>
        <p class="sub">Mande uma foto e veja <b>grátis</b>, em 1 minuto,<br>como ele fica na árvore 🎄</p>
        <div class="ex"><img src="img/exemplo-4-foto.jpg" alt=""><span>→</span><img class="orn" src="img/galeria-1.jpg" alt=""></div>
        <div class="qrbox">${svg}</div>
        <p class="url">${esc(shortLink)}</p>
        <div class="steps"><div><b>1</b>Escaneie</div><div><b>2</b>Mande a foto do pet</div><div><b>3</b>Veja grátis o enfeite</div></div>
        <p class="foot">Gostou? Enfeite impresso em 3D por <b class="js-price">${price}</b>${pickupHere ? " · <b>retire aqui, sem frete</b>" : freeShip.v ? " · frete grátis" : ""}${store ? "<br>Indicado por <b>" + esc(store) + "</b>" : ""}</p>
      </div>`;
    }
    function cardv(svg) {
      return `<div class="cardv"><div>
        <h2>Seu pet virou <em>enfeite de Natal</em> 🎄</h2>
        <p>Aponte a câmera, mande a foto do pet e veja <b>grátis</b> como fica.</p>
        <small>Enfeite 3D por <span class="js-price">${price}</span>${pickupHere ? " · retire aqui" : ""}${store ? " · " + esc(store) : ""}</small>
      </div>${svg}</div>`;
    }

    let fmt = "a5";
    function render() {
      const svg = qrSvg(link);
      document.body.className = fmt === "a5" ? "a5" : "a4 " + fmt;
      document.getElementById("page-size").textContent = `@page { size: ${fmt === "a5" ? "A5" : "A4"}; margin: 0; }`;
      const out = document.getElementById("out");
      if (fmt === "a5") out.innerHTML = `<div class="sheet">${panel(svg)}</div>`;
      else if (fmt === "a6x4") out.innerHTML = `<div class="sheet">${panel(svg).repeat(4)}</div>`;
      else out.innerHTML = `<div class="sheet">${cardv(svg).repeat(10)}</div>`;
      document.querySelectorAll("[data-fmt]").forEach((b) => b.classList.toggle("on", b.dataset.fmt === fmt));
    }
    document.querySelectorAll("[data-fmt]").forEach((b) => b.addEventListener("click", () => { fmt = b.dataset.fmt; render(); }));
    render();

    // preço e frete atuais da loja
    // preço de balcão da loja (quem vem pelo QR e retira na loja)
    Promise.all([PN.ready, code ? PN.api("partner-hit", { code, count: false }).catch(() => ({})) : {}]).then(([c, info]) => {
      if (c) freeShip.v = c.shipping_mode === "incluso" || c.shipping_mode === "gratis_ate";
      if (info && info.price_cents) { price = PN.money(info.price_cents); pickupHere = !!info.pickup; }
      else if (c) price = PN.money(c.price_cents);
      render();
    });
  })();
  </script>
</body>
</html>
